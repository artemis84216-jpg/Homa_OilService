name: Build Flutter APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Create android folder
        run: flutter create . --platforms android --project-name homa_oil_service --org com.homa
      
      - name: Change Application ID and App Name
        run: |
          # تغییر applicationId به com.homa.oil_service (مجزا از املاک)
          sed -i 's/applicationId "com.example.homa_oil_service"/applicationId "com.homa.oil_service"/' android/app/build.gradle
          # تغییر نام اپ
          sed -i 's/android:label="homa_oil_service"/android:label="Homa OilService"/' android/app/src/main/AndroidManifest.xml
      
      - name: Create Custom Gold-Black Icon
        run: |
          # ساخت آیکون اختصاصی طلایی-مشکی با ImageMagick
          for size_dir in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            dir=${size_dir%:*}
            size=${size_dir#*:}
            # پس‌زمینه مشکی + دایره طلایی + قطره روغن در مرکز
            convert -size ${size}x${size} xc:'#121212' \
              -fill '#FFD700' -draw "circle $((size/2)),$((size/2)) $((size/2)),$((size/8))" \
              -fill '#121212' -draw "circle $((size/2)),$((size/2)) $((size/2)),$((size*3/8))" \
              -fill '#FFD700' -draw "path 'M $((size/2)),$((size/4)) Q $((size*3/8)),$((size/2)) $((size/2)),$((size*3/4)) Q $((size*5/8)),$((size/2)) $((size/2)),$((size/4))'" \
              android/app/src/main/res/mipmap-$dir/ic_launcher.png
            # کپی برای ic_launcher_round
            cp android/app/src/main/res/mipmap-$dir/ic_launcher.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png
          done
      
      - name: Optimize Gradle Memory
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties
          echo "org.gradle.parallel=true" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
      
      - name: Patch Android Configurations
        run: |
          sed -i 's/compileSdk.*/compileSdk 34/' android/app/build.gradle
          sed -i 's/compileSdkVersion.*/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/org\.jetbrains\.kotlin\.android" version ".*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i "s/ext\.kotlin_version.*/ext.kotlin_version = '1.9.24'/" android/build.gradle
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <queries>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
